<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1c26">
<title>Truper26 · Catálogo 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="topbar">
    <div class="brandbox">
      <div class="brand">TRUPER<span>26</span></div>
      <div class="subtitle">Catálogo 2026</div>
    </div>
    <button id="favTop" class="header-btn" aria-label="Favoritos">♡ <span id="favCount">0</span></button>
  </div>

  <div class="search-wrap">
    <div class="searchbox">
      <span class="search-ico">⌕</span>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search"
             placeholder="Código, clave, descripción o barras">
      <button id="clear" class="clear-btn" aria-label="Limpiar búsqueda">×</button>
    </div>
    <button id="scanBtn" class="scan-btn" aria-label="Escanear código">▥</button>
  </div>

  <div id="chips" class="chips" aria-label="Categorías"></div>
</header>

<section class="controlbar">
  <div class="count">
    <strong id="stats">Cargando catálogo…</strong>
    <small id="filterText"></small>
  </div>
  <div class="controls">
    <select id="priceMode" aria-label="Precio principal">
      <option value="3">Público</option>
      <option value="2">Medio mayoreo</option>
      <option value="1">Mayoreo</option>
      <option value="0">Distribuidor</option>
    </select>
    <select id="sort" aria-label="Ordenar">
      <option value="default">Relevancia</option>
      <option value="priceAsc">Precio ↑</option>
      <option value="priceDesc">Precio ↓</option>
      <option value="key">Clave A-Z</option>
    </select>
    <button id="view" class="view-btn" aria-label="Cambiar vista">▦</button>
  </div>
</section>

<main>
  <section id="grid" class="grid" aria-live="polite"></section>
  <div id="empty" class="empty" hidden>
    <div class="empty-icon">⌕</div>
    <h3>No encontré productos</h3>
    <p>Prueba con otra clave, código o descripción.</p>
  </div>
  <div class="loadmore-wrap">
    <button id="loadMore" class="loadmore">Cargar más</button>
  </div>
</main>

<button id="top" class="topbtn" aria-label="Ir arriba">↑</button>

<div id="modal" class="modal" hidden>
  <div class="shade" data-close></div>
  <article class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <button class="modal-x" data-close aria-label="Cerrar">×</button>
    <div id="modalBody"></div>
  </article>
</div>

<div id="scanner" class="modal" hidden>
  <div class="shade" data-scan-close></div>
  <article class="scanner-sheet">
    <button class="modal-x" data-scan-close>×</button>
    <h3>Escanear código</h3>
    <video id="video" playsinline autoplay muted></video>
    <p id="scanStatus">Apunta la cámara al código de barras.</p>
  </article>
</div>

<nav class="bottomnav">
  <button id="home" class="active">⌂<span>Inicio</span></button>
  <button id="cats">▦<span>Categorías</span></button>
  <button id="favs">♡<span>Favoritos</span></button>
  <button id="up">↑<span>Arriba</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
