<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c26">
<title>Truper26 · Catálogo 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="brandrow">
    <div><div class="brand">TRUPER<span>26</span></div><div class="tagline">Catálogo visual 2026</div></div>
    <button id="favTop" class="round" aria-label="Favoritos">♡ <b id="favCount">0</b></button>
  </div>
  <div class="searchbox">
    <span>⌕</span><input id="q" type="search" autocomplete="off" placeholder="Código, clave, descripción o código de barras">
    <button id="clear" aria-label="Limpiar">×</button>
  </div>
  <div id="chips" class="chips"></div>
</header>

<section class="tools">
  <div><strong id="stats">Cargando catálogo…</strong><small id="filterText"></small></div>
  <div class="actions">
    <select id="sort"><option value="default">Relevancia</option><option value="priceAsc">Precio ↑</option><option value="priceDesc">Precio ↓</option><option value="key">Clave A-Z</option></select>
    <button id="view" title="Cambiar vista">▦</button>
  </div>
</section>

<main id="grid" class="grid"></main>
<div class="pager"><button id="prev">← Anterior</button><span id="pageLabel"></span><button id="next">Siguiente →</button></div>
<button id="top" class="topbtn">↑</button>

<div id="modal" class="modal" hidden>
 <div class="shade" data-close></div>
 <article class="sheet"><button class="x" data-close>×</button><div id="modalBody"></div></article>
</div>

<nav class="bottom">
 <button id="home" class="active">⌂<span>Inicio</span></button>
 <button id="cats">▦<span>Categorías</span></button>
 <button id="favs">♡<span>Favoritos</span></button>
 <button id="up">↑<span>Arriba</span></button>
</nav>
<script src="app.js"></script>
</body></html>
